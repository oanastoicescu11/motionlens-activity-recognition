services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    networks:
      - internal

  backend:
    build:
      context: ..
      dockerfile: deployment_artifacts/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.production
    command: >
      python -m uvicorn app.backend.main:app
      --host 0.0.0.0
      --port 8000
    depends_on:
      - redis
    networks:
      - internal

  worker:
    build:
      context: ..
      dockerfile: deployment_artifacts/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.production
    command: >
      python run_worker.py
      --workers 1
      --store-backend redis
    depends_on:
      - redis
      - backend
    networks:
      - internal

  streamlit:
    build:
      context: ..
      dockerfile: deployment_artifacts/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.production
    command: >
      python -m streamlit run src/app/ui/streamlit_app.py
      --server.address 0.0.0.0
      --server.port 8501
    depends_on:
      - backend
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - ./.env.production
    depends_on:
      - backend
      - streamlit
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal

networks:
  internal:

volumes:
  redis-data:
  caddy-data:
  caddy-config:
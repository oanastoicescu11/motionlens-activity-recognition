[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wearable-simulator"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
	"fastapi==0.136.1",
	"joblib==1.5.3",
	"numpy==2.4.4",
	"pydantic==2.10.6",
	"python-dotenv==1.2.2",
	"PyWavelets==1.9.0",
	"qrcode[pil]==8.2",
	"redis==7.4.0",
	"requests==2.33.1",
	"scipy==1.17.1",
	"streamlit==1.56.0",
	"xgboost==3.2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*", "core*"]